name: test-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "order/**"
      - "assembly/**"
      - "platform/pkg/kafka/**"
      - ".github/workflows/test-e2e.yml"

env:
  GOPROXY: https://proxy.golang.org,direct
  E2E_ENABLED: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache-dependency-path: |
            assembly/go.sum
            order/go.sum
            inventory/go.sum
            payment/go.sum
            iam/go.sum
            shared/go.sum
            platform/go.sum

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.41.0

      - name: Init Go workspace
        run: |
          go work init ./assembly ./order ./inventory ./payment ./iam ./shared ./platform || true
          go work sync

      - name: Run e2e
        run: task test:e2e
