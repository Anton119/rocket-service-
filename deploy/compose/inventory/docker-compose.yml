services:
  postgres-inventory:
    image: ${POSTGRES_IMAGE}
    container_name: postgres-inventory
    env_file:
      - ../../../inventory.env
    volumes:
      - postgres_inventory_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"    # POSTGRES_PORT=5433, чтобы не конфликтовать с order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - microservices-net

volumes:
  postgres_inventory_data:

networks:
  microservices-net:
    external: true
