syntax = "proto3";

// Package events.v1 содержит события для обмена сообщениями через Kafka.
package events.v1;

option go_package = "github.com/Anton119/rocket-service-/shared/pkg/proto/events/v1;eventsv1";

import "google/protobuf/timestamp.proto";

// OrderPaid — событие оплаты заказа.
// Producer: OrderService
// Consumer: AssemblyService
message OrderPaid {
  // event_uuid уникальный идентификатор события (для идемпотентности).
  string event_uuid = 1;

  // order_uuid идентификатор оплаченного заказа.
  string order_uuid = 2;

  // transaction_uuid идентификатор транзакции от PaymentService.
  string transaction_uuid = 3;

  // payment_method способ оплаты (CARD, SBP, ...).
  string payment_method = 4;

  // paid_at время оплаты.
  google.protobuf.Timestamp paid_at = 5;

  // user_uuid идентификатор пользователя-владельца заказа.
  string user_uuid = 6;
}

// ShipAssembled — событие завершения сборки корабля.
// Producer: AssemblyService
// Consumer: OrderService
message ShipAssembled {
  // event_uuid уникальный идентификатор события.
  string event_uuid = 1;

  // order_uuid идентификатор заказа.
  string order_uuid = 2;

  // build_time_sec время сборки в секундах.
  int64 build_time_sec = 3;

  // assembled_at время завершения сборки.
  google.protobuf.Timestamp assembled_at = 4;

  // user_uuid идентификатор пользователя-владельца заказа.
  string user_uuid = 5;
}
