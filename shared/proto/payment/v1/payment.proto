syntax = "proto3";

package payment.v1;

option go_package = "github.com/Anton119/rocket-service-/shared/pkg/proto/payment/v1;paymentv1";

// PaymentService обрабатывает оплату заказов
service PaymentService {
  // PayOrder — оплата заказа, в ответе transaction_uuid
  rpc PayOrder(PayOrderRequest) returns (PayOrderResponse);
}

// Способ оплаты
enum PaymentMethod {
  // не указан
  PAYMENT_METHOD_UNSPECIFIED = 0;
  // банковская карта
  PAYMENT_METHOD_CARD = 1;
  // СБП
  PAYMENT_METHOD_SBP = 2;
  // кредитная карта
  PAYMENT_METHOD_CREDIT_CARD = 3;
  // деньги инвестора
  PAYMENT_METHOD_INVESTOR_MONEY = 4;
}

// Запрос PayOrder
message PayOrderRequest {
  // UUID заказа (обязательный)
  string order_uuid = 1;
  // способ оплаты (обязательный)
  PaymentMethod payment_method = 2;
}

// Ответ PayOrder
message PayOrderResponse {
  // UUID транзакции оплаты
  string transaction_uuid = 1;
}
