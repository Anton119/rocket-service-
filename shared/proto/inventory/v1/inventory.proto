syntax = "proto3";

package inventory.v1;

option go_package = "github.com/Anton119/rocket-service-/shared/pkg/proto/inventory/v1;inventoryv1";

import "google/protobuf/timestamp.proto";

// InventoryService управляет каталогом деталей для космических кораблей.
service InventoryService {
  // GetPart возвращает деталь по UUID.
  rpc GetPart(GetPartRequest) returns (GetPartResponse);

  // ListParts возвращает список деталей с опциональной фильтрацией.
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);

  // ValidateCompatibility проверяет совместимость деталей между собой.
  rpc ValidateCompatibility(ValidateCompatibilityRequest) returns (ValidateCompatibilityResponse);

  // ReserveParts резервирует детали для заказа.
  rpc ReserveParts(ReservePartsRequest) returns (ReservePartsResponse);

  // ReleaseParts освобождает ранее зарезервированные детали.
  rpc ReleaseParts(ReleasePartsRequest) returns (ReleasePartsResponse);

  // CommitParts списывает детали со склада после успешной сборки корабля.
  // Вызывается OrderService после получения события ShipAssembled из Kafka.
  // stock -= 1, reserved -= 1 для каждой детали.
  rpc CommitParts(CommitPartsRequest) returns (CommitPartsResponse);
}

// PartType тип детали.
enum PartType {
  // PART_TYPE_UNSPECIFIED не указан.
  PART_TYPE_UNSPECIFIED = 0;
  // PART_TYPE_HULL корпус.
  PART_TYPE_HULL = 1;
  // PART_TYPE_ENGINE двигатель.
  PART_TYPE_ENGINE = 2;
  // PART_TYPE_SHIELD щит.
  PART_TYPE_SHIELD = 3;
  // PART_TYPE_WEAPON оружие.
  PART_TYPE_WEAPON = 4;
}

// Part представляет деталь космического корабля.
message Part {
  // uuid уникальный идентификатор детали.
  string uuid = 1;

  // name название детали.
  string name = 2;

  // description описание детали.
  string description = 3;

  // price цена в копейках (5000₽ = 500000).
  int64 price = 4;

  // part_type тип детали.
  PartType part_type = 5;

  // stock_quantity количество на складе.
  int64 stock_quantity = 6;

  // created_at дата создания.
  google.protobuf.Timestamp created_at = 7;
}

// GetPartRequest запрос на получение детали по UUID.
message GetPartRequest {
  // uuid идентификатор детали.
  string uuid = 1;
}

// GetPartResponse ответ с деталью.
message GetPartResponse {
  // part найденная деталь.
  Part part = 1;
}

// ListPartsRequest запрос на получение списка деталей.
message ListPartsRequest {
  // part_type фильтр по типу детали.
  PartType part_type = 1;

  // uuids фильтр по UUID.
  repeated string uuids = 2;
}

// ListPartsResponse ответ со списком деталей.
message ListPartsResponse {
  // parts список деталей.
  repeated Part parts = 1;
}

// ValidateCompatibilityRequest запрос на проверку совместимости деталей.
message ValidateCompatibilityRequest {
  // uuids идентификаторы деталей для проверки.
  repeated string uuids = 1;
}

// ValidateCompatibilityResponse ответ на проверку совместимости (пустой — значит совместимы).
message ValidateCompatibilityResponse {}

// ReservePartsRequest запрос на резервирование деталей.
message ReservePartsRequest {
  // uuids идентификаторы деталей для резервирования.
  repeated string uuids = 1;
}

// ReservePartsResponse ответ на резервирование (пустой — значит успешно).
message ReservePartsResponse {}

// ReleasePartsRequest запрос на освобождение ранее зарезервированных деталей.
message ReleasePartsRequest {
  // uuids идентификаторы деталей для освобождения.
  repeated string uuids = 1;
}

// ReleasePartsResponse ответ на освобождение (пустой — значит успешно).
message ReleasePartsResponse {}

// CommitPartsRequest запрос на списание деталей со склада.
message CommitPartsRequest {
  // uuids идентификаторы деталей для списания.
  repeated string uuids = 1;
}

// CommitPartsResponse ответ на списание (пустой — значит успешно).
message CommitPartsResponse {}
